name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: Build - ${{ matrix.platform.os-name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - os-name: Linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: inboxapi-cli-linux-x64
            npm-dir: cli-linux-x64
          - os-name: Linux-aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            name: inboxapi-cli-linux-arm64
            npm-dir: cli-linux-arm64
          - os-name: macOS-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            name: inboxapi-cli-macos-x64
            npm-dir: cli-darwin-x64
          - os-name: macOS-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            name: inboxapi-cli-macos-arm64
            npm-dir: cli-darwin-arm64
          - os-name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            name: inboxapi-cli-windows-x64
            npm-dir: cli-win32-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install AArch64 Cross-Compiler (Linux)
        if: matrix.platform.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binary
        run: cargo build --release --target ${{ matrix.platform.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.platform.target }}/release/inboxapi-cli.exe dist/
          else
            cp target/${{ matrix.platform.target }}/release/inboxapi-cli dist/
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: dist/*

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/*; do
            if [ -d "$dir" ]; then
              artifact_name=$(basename "$dir")
              if [ "$artifact_name" == "inboxapi-cli-windows-x64" ]; then
                cp "$dir/inboxapi-cli.exe" "release-assets/${artifact_name}.exe"
              else
                cp "$dir/inboxapi-cli" "release-assets/${artifact_name}"
              fi
            fi
          done

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true

  npm-publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read # for checkout
      id-token: write # for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 ships npm 10.x; trusted publishing requires npm >= 11.5.1
          node-version: '22'

      - name: Ensure npm supports staged publishing
        # `npm stage` requires npm >= 11.15.0; pin the 11 line explicitly
        run: npm install -g npm@11

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Error: tag '$GITHUB_REF_NAME' does not match expected pattern 'v<major>.<minor>.<patch>'" >&2
            exit 1
          fi

      - name: Publish platform packages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          publish_platform() {
            local artifact_name="$1"
            local npm_dir="$2"
            local bin_name="$3"

            cp "artifacts/${artifact_name}/${bin_name}" "npm/${npm_dir}/${bin_name}"
            chmod +x "npm/${npm_dir}/${bin_name}" 2>/dev/null || true
            (
              cd "npm/${npm_dir}" &&
              npm version "${VERSION}" --no-git-tag-version --allow-same-version &&
              npm stage publish --access public
            )
          }

          publish_platform "inboxapi-cli-linux-x64"   "cli-linux-x64"   "inboxapi-cli"
          publish_platform "inboxapi-cli-linux-arm64"  "cli-linux-arm64" "inboxapi-cli"
          publish_platform "inboxapi-cli-macos-x64"    "cli-darwin-x64"  "inboxapi-cli"
          publish_platform "inboxapi-cli-macos-arm64"  "cli-darwin-arm64" "inboxapi-cli"
          publish_platform "inboxapi-cli-windows-x64"  "cli-win32-x64"  "inboxapi-cli.exe"

      - name: Publish main package
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # Stamp version on root package and align optionalDependencies.
          # No availability wait: with staged-only publishers the platform
          # packages stay invisible until manually approved, and staging does
          # not validate that dependencies exist (they are optional anyway).
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = '${VERSION}';
            const deps = Object.keys(pkg.optionalDependencies || {});
            for (const dep of deps) {
              pkg.optionalDependencies[dep] = '${VERSION}';
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          npm stage publish --access public

      - name: Manual approval checklist
        # Staged-only publishers need human approval in the npm console.
        # Approve platform packages first: if the main package goes live
        # while its platform binary is still a draft, consumers without a
        # local Rust toolchain cannot start the CLI (index.js falls back to
        # target/ and cargo, which do not exist on their machines).
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          echo "Version ${VERSION} staged as drafts. Approve in the npm console in this order:"
          echo "  1. Platform packages:"
          node -e "Object.keys(require('./package.json').optionalDependencies || {}).forEach((d) => console.log('     - ' + d + '@${VERSION}'))"
          echo "  2. @inboxapi/cli@${VERSION} (main package, approve last)"
